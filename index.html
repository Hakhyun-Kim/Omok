<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- Prevent pinch zoom and double tap zoom on touch screens for immediate touch response -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Premium Omok (오목)</title>
  
  <!-- Font integration -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons for premium visual controls -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-wood">
  <div class="app-container">
    <main class="board-area">
      <div class="game-topbar">
        <div class="timer-card" id="turn-timer">
          <div class="timer-header">
            <span class="timer-icon"><i class="fa-solid fa-hourglass-half"></i></span>
            <span class="timer-label">생각 시간 (초읽기)</span>
          </div>
          <div class="timer-main">
            <span class="timer-countdown" id="countdown-val">30</span>
            <span class="timer-unit">초</span>
          </div>
          <div class="timer-bar-wrapper">
            <div class="timer-bar" id="timer-progress"></div>
          </div>
        </div>

        <div class="status-card">
          <div class="status-item">
            <span class="status-label">현재 차례</span>
            <strong class="status-value" id="current-turn">흑돌</strong>
          </div>
          <div class="status-item score-line">
            <span class="status-label">스코어</span>
            <span class="score-value"><strong id="score-black">0</strong> : <strong id="score-white">0</strong></span>
          </div>
        </div>
      </div>

      <div class="board-wrapper">
        <canvas id="omok-canvas" width="600" height="600"></canvas>
        <div class="turn-center-hint" id="turn-center-hint" aria-live="polite" aria-atomic="true">
          <span id="turn-center-hint-text">흑돌 차례</span>
        </div>
      </div>

      <div class="controls-row">
        <button id="btn-undo" class="control-btn" title="한 수 무르기" disabled>
          <i class="fa-solid fa-rotate-left"></i> 무르기
        </button>
        <button id="btn-reset" class="control-btn warning" title="게임 초기화">
          <i class="fa-solid fa-arrows-rotate"></i> 새 게임
        </button>
        <button id="btn-theme-wood" class="control-btn active" title="클래식 우드 테마">
          <i class="fa-solid fa-tree"></i> 클래식
        </button>
        <button id="btn-theme-neon" class="control-btn" title="사이버 네온 테마">
          <i class="fa-solid fa-circle-half-stroke"></i> 네온
        </button>
        <button id="btn-view-mode" class="control-btn" title="화면 모드 전환 (2D/3D)">
          <i class="fa-solid fa-cube"></i> <span id="btn-view-mode-text">3D 모드</span>
        </button>
        <select id="select-benefit" class="benefit-select" title="선공 베네핏 설정">
          <option value="0" selected>기본 오목</option>
          <option value="1">베네핏 1</option>
          <option value="2">베네핏 2</option>
          <option value="3">베네핏 3</option>
        </select>
      </div>
    </main>
  </div>

  <!-- Win Announcement Overlay Modal -->
  <div class="modal-overlay" id="victory-modal">
    <div class="modal-content">
      <div class="modal-icon">
        <i class="fa-solid fa-trophy animate-bounce"></i>
      </div>
      <h2 id="victory-title">승리!</h2>
      <p id="victory-message">흑돌이 5목을 완성하였습니다.</p>
      
      <div class="victory-stats">
        <div class="stat-box">
          <span class="stat-num" id="stat-moves">0</span>
          <span class="stat-label">총 수</span>
        </div>
      </div>

      <button id="btn-modal-restart" class="action-btn">
        <i class="fa-solid fa-play"></i> 다음 판 시작
      </button>
    </div>
  </div>

  <script>
    (function() {
      const viewMode = localStorage.getItem('omok_view_mode_v2') || '2d';
      const toggleBtnText = document.getElementById('btn-view-mode-text');
      const toggleBtn = document.getElementById('btn-view-mode');

      if (viewMode === '3d') {
        if (toggleBtnText) toggleBtnText.textContent = '2D 모드';
        const threeScript = document.createElement('script');
        threeScript.src = 'three.min.js';
        document.body.appendChild(threeScript);
        threeScript.onload = () => {
          const app3dScript = document.createElement('script');
          app3dScript.src = 'app3d.js';
          document.body.appendChild(app3dScript);
        };
      } else {
        if (toggleBtnText) toggleBtnText.textContent = '3D 모드';
        const appScript = document.createElement('script');
        appScript.src = 'app.js';
        document.body.appendChild(appScript);
      }

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const currentMode = localStorage.getItem('omok_view_mode_v2') || '2d';
          const nextMode = currentMode === '3d' ? '2d' : '3d';
          localStorage.setItem('omok_view_mode_v2', nextMode);
          location.reload();
        });
      }
    })();
  </script>
</body>
</html>
