<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- Prevent pinch zoom and double tap zoom on touch screens for immediate touch response -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Premium Omok (오목)</title>
  
  <!-- Font integration -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons for premium visual controls -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-wood">
  <div class="app-container">
    
    <!-- Left/Top Dashboard Section -->
    <header class="dashboard">
      <div class="brand">
        <div class="logo-mark">
          <span class="dot black"></span>
          <span class="dot white"></span>
        </div>
        <h1>Premium Omok</h1>
        <p class="subtitle">오목 (五目)</p>
      </div>

      <!-- Scoreboard with elegant state indications -->
      <div class="scoreboard">
        <div class="player-card active" id="player-black">
          <div class="avatar-ring">
            <div class="stone-avatar black"></div>
          </div>
          <div class="player-info">
            <span class="player-label">흑돌 (Black)</span>
            <span class="player-score" id="score-black">0</span>
          </div>
          <div class="turn-indicator">PLAYING</div>
        </div>
        
        <div class="player-card" id="player-white">
          <div class="avatar-ring">
            <div class="stone-avatar white"></div>
          </div>
          <div class="player-info">
            <span class="player-label">백돌 (White)</span>
            <span class="player-score" id="score-white">0</span>
          </div>
          <div class="turn-indicator">PLAYING</div>
        </div>
      </div>

      <!-- Settings and Game Customization -->
      <div class="settings-group">
        <span class="section-title"><i class="fa-solid fa-wand-magic-sparkles"></i> 테마 설정</span>
        <div class="theme-selector">
          <button class="theme-btn active" data-theme="wood" id="btn-theme-wood">
            <i class="fa-solid fa-tree"></i> 클래식 우드
          </button>
          <button class="theme-btn" data-theme="neon" id="btn-theme-neon">
            <i class="fa-solid fa-circle-half-stroke"></i> 사이버 네온
          </button>
        </div>
      </div>

      <!-- Game Actions Controls -->
      <div class="controls">
        <button id="btn-undo" class="control-btn" title="한 수 무르기" disabled>
          <i class="fa-solid fa-rotate-left"></i> 무르기
        </button>
        <button id="btn-reset" class="control-btn warning" title="게임 초기화">
          <i class="fa-solid fa-arrows-rotate"></i> 새 게임
        </button>
      </div>

      <!-- Utility / Instruction note -->
      <div class="help-card">
        <h3><i class="fa-solid fa-circle-question"></i> 터치 이용 안내</h3>
        <p>화면을 터치하거나 마우스로 클릭하여 바둑판의 교차점에 돌을 놓을 수 있습니다. 손가락 터치 시 가장 가까운 빈 눈금에 정확하게 스냅됩니다.</p>
      </div>
      
      <!-- Footer Copyright -->
      <footer class="footer">
        <p>Antigravity Studio &copy; 2026</p>
      </footer>
    </header>

    <!-- Right/Bottom Board Section -->
    <main class="board-area">
      <div class="board-wrapper">
        <canvas id="omok-canvas" width="600" height="600"></canvas>
      </div>
    </main>

  </div>

  <!-- Win Announcement Overlay Modal -->
  <div class="modal-overlay" id="victory-modal">
    <div class="modal-content">
      <div class="modal-icon">
        <i class="fa-solid fa-trophy animate-bounce"></i>
      </div>
      <h2 id="victory-title">승리!</h2>
      <p id="victory-message">흑돌이 5목을 완성하였습니다.</p>
      
      <div class="victory-stats">
        <div class="stat-box">
          <span class="stat-num" id="stat-moves">0</span>
          <span class="stat-label">총 수</span>
        </div>
      </div>

      <button id="btn-modal-restart" class="action-btn">
        <i class="fa-solid fa-play"></i> 다음 판 시작
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
